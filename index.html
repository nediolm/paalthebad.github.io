<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Öğrenciler</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f0f0f;
    color:white;
}

header{
    padding:40px;
    text-align:center;
}

.students{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card{
    background:#1a1a1a;
    padding:20px;
    width:200px;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
    text-align:center;
}

.card:hover{
    background:#333;
    transform:scale(1.05);
}

.profile{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>Okul Öğrencileri</h1>
</header>

<div class="students" id="studentsContainer"></div>

<div id="profileBox" class="profile">
    <span class="close" onclick="closeProfile()">X</span>
    <h2 id="studentName"></h2>
    <p id="age"></p>
    <p id="feature"></p>
    <p id="doing"></p>
    <p id="extra"></p>
</div>

<script>

let students = {};

fetch("students.txt")
.then(response => response.text())
.then(data => {

    const lines = data.trim().split("\n");
    const container = document.getElementById("studentsContainer");

    lines.forEach(line => {

        const parts = line.split("|");

        if(parts.length === 5){

            const name = parts[0];

            students[name] = {
                age: parts[1],
                feature: parts[2],
                doing: parts[3],
                extra: parts[4]
            };

            // Kartı otomatik oluştur
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = "<h3>" + name + "</h3>";
            card.onclick = function(){ openProfile(name); };

            container.appendChild(card);
        }

    });

});

function openProfile(name){

    document.getElementById("studentName").innerText = name;
    document.getElementById("age").innerText = "Yaş: " + students[name].age;
    document.getElementById("feature").innerText = "Özellik: " + students[name].feature;
    document.getElementById("doing").innerText = "Ne yapar: " + students[name].doing;
    document.getElementById("extra").innerText = "Ekstra: " + students[name].extra;

    document.getElementById("profileBox").style.display = "flex";
}

function closeProfile(){
    document.getElementById("profileBox").style.display = "none";
}

</script>

</body>
</html>
