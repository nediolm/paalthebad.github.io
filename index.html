<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okulun Gözde Elemanları</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f0f0f;
    color:white;
    scroll-behavior:smooth;
}

header{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(black,#111);
}

header img{
    width:600px;
    height:400px;
    border-radius:0%;
    object-fit:square;
    border:4px solid white;
}

header h1{
    margin-top:20px;
    font-size:30px;
}

.section{
    padding:80px 20px;
    text-align:center;
}

.students{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    background:#1a1a1a;
    padding:20px;
    width:200px;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    background:#333;
    transform:scale(1.05);
}

.profile{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.profile h2{
    margin-bottom:20px;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <img src="PAALTHEBAD.png" alt="">
    <h1>Okulun Gözde Elemanları</h1>
    <p>Aşağı kaydır 👇</p>
</header>

<div class="section">
    <h2>Öğrenciler</h2>
    <div class="students">

        <div class="card" onclick="openProfile('Ali')">
            <h3>Ali</h3>
        </div>

        <div class="card" onclick="openProfile('Mehmet')">
            <h3>Mehmet</h3>
        </div>

        <div class="card" onclick="openProfile('Ahmet')">
            <h3>Ahmet</h3>
        </div>

        <div class="card" onclick="openProfile('Kerem')">
            <h3>Kerem</h3>
        </div>

    </div>
</div>

<div id="profileBox" class="profile">
    <span class="close" onclick="closeProfile()">X</span>
    <h2 id="studentName"></h2>
    <p>Yaş: bilgiçıkıcak</p>
    <p>Özellik: bilgiçıkıcak</p>
    <p>Ne yapıyor: bilgiçıkıcak</p>
    <p>Ekstra: bilgiçıkıcak</p>
</div>

<script>
function openProfile(name){
    document.getElementById("studentName").innerText = name;
    document.getElementById("profileBox").style.display = "flex";
}

function closeProfile(){
    document.getElementById("profileBox").style.display = "none";
}
</script>

</body>
</html>
