<script>
let students = {};

fetch("students.txt")
.then(response => {
    if (!response.ok) {
        throw new Error("Dosya bulunamadı");
    }
    return response.text();
})
.then(data => {
    const lines = data.trim().split("\n");

    lines.forEach(line => {
        const parts = line.split("|");
        if(parts.length === 5){
            students[parts[0]] = {
                age: parts[1],
                feature: parts[2],
                doing: parts[3],
                extra: parts[4]
            };
        }
    });
})
.catch(error => {
    console.error("HATA:", error);
});

function openProfile(name){
    if(!students[name]){
        alert("Veri yüklenmedi.");
        return;
    }

    document.getElementById("studentName").innerText = name;
    document.getElementById("age").innerText = "Yaş: " + students[name].age;
    document.getElementById("feature").innerText = "Görünüş: " + students[name].feature;
    document.getElementById("doing").innerText = "Hobi: " + students[name].doing;
    document.getElementById("extra").innerText = "Ekstra: " + students[name].extra;

    document.getElementById("profileBox").style.display = "flex";
}

function closeProfile(){
    document.getElementById("profileBox").style.display = "none";
}
</script>
