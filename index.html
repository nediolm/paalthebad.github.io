<script>
let students = {};

fetch("students.txt")
.then(response => response.text())
.then(data => {
    const lines = data.split("\n");

    lines.forEach(line => {
        const parts = line.split("|");

        if(parts.length === 5){
            students[parts[0]] = {
                age: parts[1],
                feature: parts[2],
                doing: parts[3],
                extra: parts[4]
            };
        }
    });
});

function openProfile(name){
    document.getElementById("studentName").innerText = name;
    document.getElementById("age").innerText = "Yaş: " + students[name].age;
    document.getElementById("feature").innerText = "Görünüş: " + students[name].feature;
    document.getElementById("doing").innerText = "Hobi ve Alışkanlıkları: " + students[name].doing;
    document.getElementById("extra").innerText = "Sigara: " + students[name].extra;

    document.getElementById("profileBox").style.display = "flex";
}

function closeProfile(){
    document.getElementById("profileBox").style.display = "none";
}
</script>
